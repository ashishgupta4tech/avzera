<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
      <defs>
        <linearGradient id="sig-grad-primary" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="35%" stop-color="#06b6d4" />
          <stop offset="70%" stop-color="#818cf8" />
          <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <linearGradient id="sig-grad-v" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="50%" stop-color="#06b6d4" />
          <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
        <radialGradient id="sig-core-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
          <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15" />
          <stop offset="100%" stop-color="#030712" stop-opacity="0" />
        </radialGradient>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="8" result="blur1" />
          <feGaussianBlur stdDeviation="16" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="neon-intense" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="b1" />
          <feMerge>
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Background: Deep Obsidian -->
      <rect width="1000" height="700" rx="32" fill="#030712" />
      <rect x="2" y="2" width="996" height="696" rx="30" fill="none" stroke="#1e293b" stroke-width="1.5" />

      <!-- Center Ambient Halo -->
      <circle cx="500" cy="350" r="280" fill="url(#sig-core-glow)" />

      <!-- Faint Background Technical Guides (Showing the A, V, Z geometry) -->
      <!-- Vertical Axis of Tension (connecting A-Apex to V-Downward Spike) -->
      <line x1="590" y1="90" x2="535" y2="460" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
      <!-- Horizontal Flow Axis -->
      <line x1="100" y1="210" x2="880" y2="210" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 8" opacity="0.25" />
      <line x1="100" y1="385" x2="880" y2="385" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 8" opacity="0.25" />

      <!-- GROUP 1: THE FOUNDER SIGNATURE STROKE RIBBONS -->
      <g filter="url(#neon-glow)">
        
        <!-- 1. Left Lower Entry Slash (shooting up towards the top horizontal) -->
        <path d="M 120 420 L 440 195" 
              stroke="#0284c7" stroke-width="7" stroke-linecap="round" opacity="0.85" />

        <!-- 2. The Upper Left Loop (leading into the top horizontal Z bar) -->
        <path d="M 440 195 Q 260 210 168 212 C 150 212 148 220 162 225 Q 280 220 460 205 L 795 175" 
              stroke="url(#sig-grad-primary)" stroke-width="8" stroke-linecap="round" fill="none" />

        <!-- 3. The Top Right Acute Wingtip & Diagonal Z-Slash -->
        <!-- From right wingtip (795, 175) cutting down-left across the center to (255, 375) -->
        <path d="M 795 175 L 255 375" 
              stroke="url(#sig-grad-primary)" stroke-width="9" stroke-linecap="round" />

        <!-- 4. The Bottom Horizontal Baseline (Extending to the right) -->
        <!-- Loops from (255, 375) smoothly into the bottom flat line out to (775, 385) -->
        <path d="M 255 375 Q 235 380 250 384 L 775 385" 
              stroke="url(#sig-grad-primary)" stroke-width="8" stroke-linecap="round" fill="none" />

        <!-- 5. THE VERTICAL A & V CORE STROKES -->
        <!-- Upward Needle A-Apex: (590, 115) -->
        <!-- Downward Needle V-Spike: (535, 435) -->
        <!-- Stroke descending from top A apex through the Z diagonal down to V spike -->
        <path d="M 590 115 L 535 435" 
              stroke="url(#sig-grad-v)" stroke-width="9" stroke-linecap="round" />

        <!-- Upward return stroke from V spike cutting back up-left to (430, 310) -->
        <path d="M 535 435 L 430 310" 
              stroke="#06b6d4" stroke-width="8" stroke-linecap="round" />

        <!-- Connecting diagonal from (430, 310) rising up to the A-apex (590, 115) to complete the A-frame -->
        <path d="M 430 310 L 590 115" 
              stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.9" />

      </g>

      <!-- GROUP 2: WHITE-HOT INNER CORE FILAMENTS (Creates the ultra-high-tech electric energy) -->
      <g filter="url(#neon-intense)">
        <!-- Inner white spine of top horizontal -->
        <path d="M 180 215 L 780 178" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
        <!-- Inner white spine of Z diagonal slash -->
        <path d="M 780 178 L 265 373" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95" />
        <!-- Inner white spine of bottom baseline -->
        <path d="M 265 384 L 760 385" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
        <!-- Inner white spine of A-Apex to V-Spike -->
        <path d="M 588 120 L 536 430" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95" />
        <!-- V return stroke -->
        <path d="M 536 430 L 435 312" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
        <path d="M 435 312 L 588 120" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      </g>

      <!-- GROUP 3: 6 SYNAPTIC QUANTUM NODES (Marking the critical vertexes of A, V, Z) -->
      <!-- 1. Node A (Top Apex): (590, 115) -->
      <circle cx="590" cy="115" r="9" fill="#67e8f9" stroke="#ffffff" stroke-width="3" filter="url(#neon-intense)" />
      <!-- 2. Node V (Bottom Spike): (535, 435) -->
      <circle cx="535" cy="435" r="9" fill="#c084fc" stroke="#ffffff" stroke-width="3" filter="url(#neon-intense)" />
      <!-- 3. Node Z-Right (Far Right Wingtip): (795, 175) -->
      <circle cx="795" cy="175" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
      <!-- 4. Node Z-Left (Bottom Left Turn): (255, 375) -->
      <circle cx="255" cy="375" r="8" fill="#06b6d4" stroke="#ffffff" stroke-width="2.5" />
      <!-- 5. Node Left-Loop: (160, 215) -->
      <circle cx="160" cy="215" r="6" fill="#818cf8" stroke="#ffffff" stroke-width="2" />
      <!-- 6. Central Convergence Singularity: (490, 275) -->
      <circle cx="490" cy="275" r="10" fill="#ffffff" stroke="#06b6d4" stroke-width="4" filter="url(#neon-intense)" />

      <!-- Typography Sub-Badge -->
      <g transform="translate(500, 560)">
        <text x="0" y="0" 
              font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
              font-size="44" 
              font-weight="900" 
              letter-spacing="12" 
              fill="#ffffff" 
              text-anchor="middle">AVZERA</text>
        <text x="0" y="32" 
              font-family="'JetBrains Mono', monospace" 
              font-size="13" 
              font-weight="700" 
              letter-spacing="5" 
              fill="#38bdf8" 
              text-anchor="middle">FOUNDER KINETIC MONOGRAM • [A • V • Z]</text>
        <text x="0" y="58" 
              font-family="system-ui" 
              font-size="12" 
              font-weight="600" 
              fill="#94a3b8" 
              text-anchor="middle">Accuracy (Apex) • Vision (Vector) • Zero-Compromise (Zenith Blade)</text>
      </g>
    </svg>