<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
      
    <defs>
      <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="12" result="blur2" />
        <feMerge>
          <feMergeNode in="blur2" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <linearGradient id="grad-cyan-apex" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="50%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#0284c7" />
      </linearGradient>
      <linearGradient id="grad-z-blade" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#22d3ee" />
        <stop offset="50%" stop-color="#818cf8" />
        <stop offset="100%" stop-color="#c084fc" />
      </linearGradient>
      <linearGradient id="grad-purple-base" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a855f7" />
        <stop offset="50%" stop-color="#6366f1" />
        <stop offset="100%" stop-color="#3b82f6" />
      </linearGradient>
      <linearGradient id="grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
        <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4" />
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
      </linearGradient>
      <radialGradient id="bg-radial" cx="50%" cy="50%" r="65%">
        <stop offset="0%" stop-color="#0c1836" />
        <stop offset="60%" stop-color="#030712" />
        <stop offset="100%" stop-color="#02040a" />
      </radialGradient>
      <radialGradient id="singularity-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#67e8f9" stop-opacity="1" />
        <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8" />
        <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
      </radialGradient>
    </defs>
    
      
      
    <g transform="translate(0, 0)">
      <!-- Outer Neural Ambient Halo -->
      <circle cx="256" cy="256" r="140" fill="url(#singularity-glow)" />

      <!-- Synaptic Circuit Grid Accents -->
      <line x1="256" y1="40" x2="256" y2="82" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <line x1="90" y1="410" x2="112" y2="382" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <line x1="422" y1="410" x2="400" y2="382" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.6" />

      <!-- 1. The Left Ascent (The 'A' Pillar - Accuracy) -->
      <path d="M 256 82 L 284 130 L 174 382 L 112 382 Z" 
            fill="url(#grad-cyan-apex)" 
            filter="url(#glow-cyan)" />

      <!-- 2. The Right Slope (The 'V' Convergent Wing - Vision) -->
      <path d="M 256 82 L 400 382 L 338 382 L 228 130 Z" 
            fill="url(#grad-purple-base)" 
            filter="url(#glow-purple)" 
            opacity="0.95" />

      <!-- 3. The Central Dynamic Z-Blade (Zero-compromise Precision Energy) -->
      <!-- Connects upper right facet to lower left with razor-sharp dynamic diagonal -->
      <path d="M 186 214 L 340 214 L 322 254 L 168 254 Z" 
            fill="url(#grad-z-blade)" 
            filter="url(#glow-cyan)" />
      
      <!-- Transversal Dynamic Interlock (Creating the crisp Z illusion) -->
      <path d="M 204 290 L 358 290 L 340 330 L 186 330 Z" 
            fill="url(#grad-z-blade)" 
            opacity="0.9" />

      <!-- Isometric Core Connector (Connecting A-V-Z into unified cybernetic crest) -->
      <path d="M 228 130 L 284 130 L 256 186 Z" 
            fill="#38bdf8" />

      <!-- 4. Central Quantum Singularity / Neural Diamond -->
      <polygon points="256,236 276,256 256,276 236,256" 
               fill="#ffffff" 
               filter="url(#glow-cyan)" />

      <!-- 5. Six Synaptic Value Nodes (A, V, Z, E, R, A) -->
      <!-- Node A1 (Apex): Accuracy -->
      <circle cx="256" cy="82" r="7" fill="#67e8f9" stroke="#ffffff" stroke-width="2.5" />
      <!-- Node V (Right Slope): Vision -->
      <circle cx="400" cy="382" r="7" fill="#a855f7" stroke="#ffffff" stroke-width="2.5" />
      <!-- Node Z (Left Base): Zero-compromise -->
      <circle cx="112" cy="382" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="2.5" />
      <!-- Node E (Mid-Right): Excellence -->
      <circle cx="340" cy="214" r="5" fill="#c084fc" stroke="#ffffff" stroke-width="1.5" />
      <!-- Node R (Mid-Left): Reliability -->
      <circle cx="174" cy="382" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <!-- Node A2 (Singularity): Assurance -->
      <circle cx="256" cy="256" r="4" fill="#ffffff" />
    </g>
    
    </svg>