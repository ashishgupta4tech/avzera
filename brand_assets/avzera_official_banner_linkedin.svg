<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#08152c" />
  <polygon points="880,0 1200,0 1200,400 720,400" fill="#0c1e3e" />
  <polygon points="880,0 910,0 750,400 720,400" fill="#0066ff" opacity="0.2" />
  <polygon points="1040,0 1055,0 895,400 880,400" fill="#0080ff" opacity="0.14" />
  
  <defs>
    
    <!-- Master Letter A with 3D Pyramid -->
    <g id="letterA">
      <path d="M0,120 L42,0 L78,0 L120,120 L89,120 L59,34 L31,120 Z" fill="#ffffff"/>
      <polygon points="60,65 41,120 60,120" fill="#0082fe"/>
      <polygon points="60,65 60,120 79,120" fill="#005afc"/>
    </g>

    <!-- Master Letter V -->
    <g id="letterV">
      <path d="M0,0 L31,0 L60,86 L89,0 L120,0 L78,120 L42,120 Z" fill="#ffffff"/>
    </g>

    <!-- Master Letter Z with 3D Ribbon Fold -->
    <g id="letterZ">
      <polygon points="5,0 108,0 108,25 5,25" fill="#0066fe"/>
      <polygon points="108,25 24,95 0,95 72,25" fill="#0066fe"/>
      <polygon points="72,25 108,25 60,95 24,95" fill="#0084ff"/>
      <polygon points="0,94 108,94 108,120 0,120" fill="#0066fe"/>
    </g>

    <!-- Master Letter E -->
    <g id="letterE">
      <rect x="0" y="0" width="30" height="120" fill="#ffffff"/>
      <rect x="30" y="0" width="60" height="24" fill="#ffffff"/>
      <rect x="30" y="48" width="51" height="24" fill="#ffffff"/>
      <rect x="30" y="94" width="64" height="26" fill="#ffffff"/>
    </g>

    <!-- Master Letter R -->
    <g id="letterR">
      <rect x="0" y="0" width="30" height="120" fill="#ffffff"/>
      <path d="M30,0 L68,0 C93,0 108,13 108,34 C108,55 93,68 68,68 L30,68 Z M30,22 L65,22 C78,22 83,27 83,34 C83,41 78,46 65,46 L30,46 Z" fill="#ffffff" fill-rule="evenodd"/>
      <polygon points="54,68 84,68 109,120 78,120" fill="#ffffff"/>
    </g>
    
  </defs>

  <!-- Left Logo with 3D Pyramid A's -->
  <g transform="translate(60, 95) scale(0.72)">
    
    <use href="#letterA" x="0" y="0"/>
    <use href="#letterV" x="136" y="0"/>
    <use href="#letterZ" x="270" y="0"/>
    <use href="#letterE" x="404" y="0"/>
    <use href="#letterR" x="523" y="0"/>
    <use href="#letterA" x="644" y="0"/>
    
    <text x="382" y="195" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="14">DIGITAL SOLUTIONS</text>
  </g>

  <line x1="720" y1="95" x2="720" y2="305" stroke="#1e3a5f" stroke-width="2" />

  <!-- Right Services -->
  <g transform="translate(760, 125)" font-family="system-ui, -apple-system, sans-serif">
    <text x="0" y="0" fill="#0080ff" font-size="14" font-weight="700" letter-spacing="3">INNOVATE • BUILD • GROW</text>
    <text x="0" y="38" fill="#ffffff" font-size="26" font-weight="700">Web Development</text>
    <text x="0" y="74" fill="#ffffff" font-size="26" font-weight="700">Site Modernisation &amp; UI/UX</text>
    <text x="0" y="110" fill="#ffffff" font-size="26" font-weight="700">Custom Digital Solutions</text>
    
    <rect x="0" y="138" width="195" height="36" rx="6" fill="#0066ff" />
    <text x="97" y="161" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="1.5">WWW.AVZERA.COM</text>
  </g>
</svg>