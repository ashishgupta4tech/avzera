<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280">
  <defs>
    
    <linearGradient id="avz-master-grad" x1="5%" y1="90%" x2="95%" y2="10%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="20%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="arrow-master-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="z-glyph-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <radialGradient id="avz-glow-ambient" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </radialGradient>
    <filter id="avz-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    
    <mask id="ribbon-mask-dark">
      <rect width="1000" height="600" fill="white"/>
      <circle cx="430" cy="118" r="16" fill="black"/>
      <circle cx="452" cy="195" r="16" fill="black"/>
      <circle cx="342" cy="165" r="16" fill="black"/>
      <circle cx="378" cy="248" r="16" fill="black"/>
      <circle cx="465" cy="250" r="16" fill="black"/>
      <circle cx="488" cy="115" r="16" fill="black"/>
    </mask>
    <mask id="ribbon-mask-light">
      <rect width="1000" height="600" fill="white"/>
      <circle cx="430" cy="118" r="16" fill="black"/>
      <circle cx="452" cy="195" r="16" fill="black"/>
      <circle cx="342" cy="165" r="16" fill="black"/>
      <circle cx="378" cy="248" r="16" fill="black"/>
      <circle cx="465" cy="250" r="16" fill="black"/>
      <circle cx="488" cy="115" r="16" fill="black"/>
    </mask>

  </defs>

  <!-- Obsidian Canvas -->
  <rect width="100%" height="100%" fill="#060a12" rx="20"/>
  <rect x="1" y="1" width="1098" height="278" fill="none" stroke="#1e293b" stroke-width="1.5" rx="19"/>
  <circle cx="160" cy="140" r="160" fill="url(#avz-glow-ambient)"/>

  <!-- Left: The Unistroke Interlaced Ribbon Mark -->
  <g transform="translate(30, 20) scale(0.55)">
    <!-- Ambient Under-Glow -->
    <g filter="url(#avz-glow-filter)" opacity="0.6">
      <path d="M 110 320 L 415 65 L 465 375 L 325 95 L 635 95 L 265 270 Q 235 285 268 298 L 595 298 Q 635 298 658 268 L 685 195" fill="none" stroke="url(#avz-master-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Master Interlaced Ribbon with Mask -->
    <g mask="url(#ribbon-mask-dark)">
      <path d="M 110 320 L 415 65 L 465 375 L 325 95 L 635 95 L 265 270 Q 235 285 268 298 L 595 298 Q 635 298 658 268 L 685 195" fill="none" stroke="url(#avz-master-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Weave Bridges (restoring over-and-under intersections) -->
    <circle cx="430" cy="118" r="11" fill="#0284c7"/>
    <circle cx="342" cy="165" r="11" fill="#2563eb"/>
    <circle cx="465" cy="250" r="11" fill="#06b6d4"/>

    <!-- Sharp Upward Launching Growth Arrow -->
    <path d="M 662 225 L 692 188 L 650 178" fill="none" stroke="url(#arrow-master-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 688 185 L 656 220 L 666 182 L 646 172 Z" fill="#34d399"/>

    <!-- Kinetic Energy Nodes -->
    <circle cx="110" cy="320" r="6" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="415" cy="65" r="7" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <circle cx="465" cy="375" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <circle cx="635" cy="95" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Elegant Vertical Divider -->
  <line x1="435" y1="50" x2="435" y2="230" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="435" y1="100" x2="435" y2="180" stroke="#0284c7" stroke-width="2" opacity="0.6"/>

  <!-- Right: Custom Pure Vector Wordmark -->
  
    <g transform="translate(480, 72) scale(0.92)">
      <!-- Letter A (Left) -->
      <path d="M 0 90 L 30 0 L 48 0 L 78 90 L 59 90 L 51 68 L 27 68 L 19 90 Z M 32 52 L 46 52 L 39 26 Z" fill="#ffffff"/>
      <!-- Letter V -->
      <path transform="translate(88, 0)" d="M 0 0 L 19 0 L 39 66 L 59 0 L 78 0 L 47 90 L 31 90 Z" fill="#ffffff"/>
      <!-- Letter Z (Brand Hero Glyph) -->
      <path transform="translate(176, 0)" d="M 0 0 L 74 0 L 74 16 L 24 74 L 74 74 L 74 90 L 0 90 L 0 74 L 50 16 L 0 16 Z" fill="url(#z-glyph-grad)"/>
      <!-- Letter E -->
      <path transform="translate(260, 0)" d="M 0 0 L 68 0 L 68 16 L 17 16 L 17 37 L 58 37 L 58 53 L 17 53 L 17 74 L 68 74 L 68 90 L 0 90 Z" fill="#ffffff"/>
      <!-- Letter R -->
      <path transform="translate(338, 0)" d="M 0 0 L 48 0 C 64 0 74 9 74 25 C 74 38 65 48 50 50 L 74 90 L 53 90 L 32 52 L 17 52 L 17 90 L 0 90 Z M 17 16 L 17 36 L 46 36 C 53 36 57 32 57 26 C 57 20 53 16 46 16 Z" fill="#ffffff"/>
      <!-- Letter A (Right) -->
      <path transform="translate(422, 0)" d="M 0 90 L 30 0 L 48 0 L 78 90 L 59 90 L 51 68 L 27 68 L 19 90 Z M 32 52 L 46 52 L 39 26 Z" fill="#ffffff"/>
    </g>
    

  <!-- Tagline / Subtitle in Precision Spaced Sans -->
  <g transform="translate(482, 192)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" letter-spacing="9" fill="#38bdf8">GLOBAL IT SERVICES</text>
  </g>
  <g transform="translate(940, 192)">
    <circle cx="0" cy="-4" r="3" fill="#10b981"/>
    <text x="12" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#64748b">ENTERPRISE</text>
  </g>
</svg>
