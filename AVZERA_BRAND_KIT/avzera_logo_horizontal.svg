<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
      <defs>
        <linearGradient id="h-grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="60%" stop-color="#e2e8f0" />
          <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>
        <linearGradient id="h-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
        <linearGradient id="h-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a855f7" />
          <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="h-grad-blade" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#06b6d4" />
          <stop offset="50%" stop-color="#818cf8" />
          <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Background: Transparent / Dark Obsidian -->
      <rect width="960" height="260" rx="24" fill="#030712" />
      <rect x="1" y="1" width="958" height="258" rx="23" fill="none" stroke="#1e293b" stroke-width="1.5" />

      <!-- Left Icon Container (scaled down to fit 200x200 at x=40, y=30) -->
      <g transform="translate(45, 30) scale(0.39)">
        <!-- Outer Glow -->
        <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.15" filter="url(#h-glow)" />
        <!-- Left Pillar A -->
        <path d="M 256 82 L 284 130 L 174 382 L 112 382 Z" fill="url(#h-grad-cyan)" filter="url(#h-glow)" />
        <!-- Right Wing V -->
        <path d="M 256 82 L 400 382 L 338 382 L 228 130 Z" fill="url(#h-grad-purple)" />
        <!-- Z Blade -->
        <path d="M 186 214 L 340 214 L 322 254 L 168 254 Z" fill="url(#h-grad-blade)" filter="url(#h-glow)" />
        <path d="M 204 290 L 358 290 L 340 330 L 186 330 Z" fill="url(#h-grad-blade)" />
        <polygon points="256,236 276,256 256,276 236,256" fill="#ffffff" filter="url(#h-glow)" />
        <circle cx="256" cy="82" r="8" fill="#67e8f9" stroke="#ffffff" stroke-width="2" />
        <circle cx="400" cy="382" r="8" fill="#a855f7" stroke="#ffffff" stroke-width="2" />
        <circle cx="112" cy="382" r="8" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
      </g>

      <!-- Vertical Divider -->
      <line x1="270" y1="50" x2="270" y2="210" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

      <!-- AVZERA Typographic Wordmark -->
      <g transform="translate(305, 0)">
        <!-- Brand Name -->
        <text x="0" y="128" 
              font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" 
              font-size="78" 
              font-weight="900" 
              letter-spacing="6" 
              fill="url(#h-grad-text)">AVZERA</text>

        <!-- Registered / Tech Badge -->
        <rect x="420" y="70" width="84" height="24" rx="6" fill="#0c1e3d" stroke="#0284c7" stroke-width="1" />
        <text x="462" y="86" 
              font-family="'JetBrains Mono', 'Segoe UI', monospace" 
              font-size="11" 
              font-weight="800" 
              fill="#38bdf8" 
              letter-spacing="1" 
              text-anchor="middle">CORP</text>

        <!-- Legal Entity Sub-Headline -->
        <text x="4" y="166" 
              font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
              font-size="17" 
              font-weight="700" 
              letter-spacing="5" 
              fill="#94a3b8">TECHNOLOGIES PRIVATE LIMITED</text>

        <!-- Strategic Pill Badges -->
        <g transform="translate(4, 186)">
          <!-- Pill 1: Accuracy -->
          <rect x="0" y="0" width="100" height="24" rx="12" fill="#082f49" stroke="#0369a1" stroke-width="1" />
          <text x="50" y="16" font-family="system-ui" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">ACCURACY</text>

          <!-- Pill 2: Vision -->
          <rect x="110" y="0" width="86" height="24" rx="12" fill="#2e1065" stroke="#6b21a8" stroke-width="1" />
          <text x="153" y="16" font-family="system-ui" font-size="10.5" font-weight="700" fill="#c084fc" text-anchor="middle">VISION</text>

          <!-- Pill 3: Zero-Compromise -->
          <rect x="206" y="0" width="138" height="24" rx="12" fill="#022c22" stroke="#047857" stroke-width="1" />
          <text x="275" y="16" font-family="system-ui" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle">ZERO-COMPROMISE</text>

          <!-- Pill 4: AI Systems -->
          <rect x="354" y="0" width="130" height="24" rx="12" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
          <text x="419" y="16" font-family="system-ui" font-size="10.5" font-weight="700" fill="#a5b4fc" text-anchor="middle">AI &amp; WEB FUNNELS</text>
        </g>
      </g>
    </svg>