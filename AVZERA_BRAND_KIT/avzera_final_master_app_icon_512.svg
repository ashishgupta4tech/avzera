<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <defs>
    <linearGradient id="avCyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <linearGradient id="zGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <radialGradient id="avAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0088ff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="50%" stop-color="#090d16"/>
    <stop offset="100%" stop-color="#030712"/>
  </linearGradient>
  <linearGradient id="squircleRim" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
    <stop offset="40%" stop-color="#1e293b" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#0066ff" stop-opacity="0.5"/>
  </linearGradient>

  <!-- iOS Squircle Body -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#squircleBg)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#squircleRim)" stroke-width="2.5"/>

  <!-- Ambient Glow in the Center -->
  <circle cx="256" cy="256" r="180" fill="url(#avAmbientGlow)"/>

  <!-- Centered AV Monogram -->
  <g filter="url(#neonGlow)">
    
    <g transform="translate(74, 152) scale(1.28)">
      <!-- Letter A -->
      <path d="M 0 160 L 56 0 L 98 0 L 154 160 L 116 160 L 102 118 L 52 118 L 38 160 Z M 60 92 L 94 92 L 77 44 Z" fill="url(#avCyanBlueGrad)"/>
      <!-- Triangular Apex Notch -->
      <polygon points="77,44 60,92 94,92" fill="#090d16"/>
      <polygon points="77,28 88,58 66,58" fill="url(#avCyanBlueGrad)"/>
      
      <!-- Letter V (Parallel Geometry) -->
      <path transform="translate(132, 0)" d="M 0 0 L 38 0 L 76 114 L 114 0 L 152 0 L 95 160 L 57 160 Z" fill="url(#avCyanBlueGrad)"/>
    </g>
    
  </g>
</svg>