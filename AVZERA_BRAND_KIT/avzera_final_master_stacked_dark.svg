<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  
  <defs>
    <linearGradient id="avCyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <linearGradient id="zGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <radialGradient id="avAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0088ff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#070b14" rx="28"/>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="#1e293b" stroke-width="1.5" rx="27"/>
  <circle cx="400" cy="220" r="260" fill="url(#avAmbientGlow)"/>

  <!-- Top Center: AV Monogram -->
  <g filter="url(#neonGlow)">
    
    <g transform="translate(242, 70) scale(1.1)">
      <!-- Letter A -->
      <path d="M 0 160 L 56 0 L 98 0 L 154 160 L 116 160 L 102 118 L 52 118 L 38 160 Z M 60 92 L 94 92 L 77 44 Z" fill="url(#avCyanBlueGrad)"/>
      <!-- Triangular Apex Notch -->
      <polygon points="77,44 60,92 94,92" fill="#070b14"/>
      <polygon points="77,28 88,58 66,58" fill="url(#avCyanBlueGrad)"/>
      
      <!-- Letter V (Parallel Geometry) -->
      <path transform="translate(132, 0)" d="M 0 0 L 38 0 L 76 114 L 114 0 L 152 0 L 95 160 L 57 160 Z" fill="url(#avCyanBlueGrad)"/>
    </g>
    
  </g>

  <!-- Centered Wordmark -->
  
    <g transform="translate(118, 360) scale(1.1)">
      <!-- Letter A (Initial) with Triangular Tech Counterform -->
      <path d="M 0 90 L 31 0 L 50 0 L 81 90 L 61 90 L 53 68 L 28 68 L 20 90 Z M 32 50 L 49 50 L 40.5 25 Z" fill="#ffffff"/>
      <polygon points="40.5,25 32,50 49,50" fill="#070b14"/>
      <polygon points="40.5,18 47.5,36 33.5,36" fill="url(#zGlowGrad)"/>

      <!-- Letter V -->
      <path transform="translate(89, 0)" d="M 0 0 L 20 0 L 41 68 L 62 0 L 82 0 L 51 90 L 31 90 Z" fill="#ffffff"/>

      <!-- Letter Z (Hero Accent) -->
      <path transform="translate(179, 0)" d="M 0 0 L 76 0 L 76 17 L 25 73 L 76 73 L 76 90 L 0 90 L 0 73 L 51 17 L 0 17 Z" fill="url(#zGlowGrad)"/>

      <!-- Letter E -->
      <path transform="translate(263, 0)" d="M 0 0 L 70 0 L 70 17 L 18 17 L 18 36 L 60 36 L 60 53 L 18 53 L 18 73 L 70 73 L 70 90 L 0 90 Z" fill="#ffffff"/>

      <!-- Letter R -->
      <path transform="translate(341, 0)" d="M 0 0 L 50 0 C 66 0 76 9 76 26 C 76 39 67 49 52 51 L 76 90 L 55 90 L 33 53 L 18 53 L 18 90 L 0 90 Z M 18 17 L 18 36 L 47 36 C 54 36 58 32 58 26 C 58 21 54 17 47 17 Z" fill="#ffffff"/>

      <!-- Letter A (Terminal) -->
      <path transform="translate(425, 0)" d="M 0 90 L 31 0 L 50 0 L 81 90 L 61 90 L 53 68 L 28 68 L 20 90 Z M 32 50 L 49 50 L 40.5 25 Z" fill="#ffffff"/>
      <polygon points="40.5,25 32,50 49,50" fill="#070b14"/>
      <polygon points="40.5,18 47.5,36 33.5,36" fill="url(#zGlowGrad)"/>
    </g>
    

  <!-- Subtitle -->
  <text x="400" y="505" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="14" fill="#38bdf8">GLOBAL IT SERVICES</text>
  <text x="400" y="540" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" letter-spacing="4" fill="#64748b">AI SOLUTIONS · CLOUD INFRASTRUCTURE · ENTERPRISE</text>
</svg>