<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neon-flow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="trace-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background: Deep Obsidian -->
  <rect width="900" height="1050" rx="32" fill="#030712" />
  <rect x="2" y="2" width="896" height="1046" rx="30" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ruled notebook lines (faint, subtle background context) -->
  <g opacity="0.15" stroke="#334155" stroke-width="1">
    <line x1="60" y1="120" x2="840" y2="120" />
    <line x1="60" y1="200" x2="840" y2="200" />
    <line x1="60" y1="280" x2="840" y2="280" />
    <line x1="60" y1="360" x2="840" y2="360" />
    <line x1="60" y1="440" x2="840" y2="440" />
    <line x1="60" y1="520" x2="840" y2="520" />
    <line x1="60" y1="600" x2="840" y2="600" />
    <line x1="60" y1="680" x2="840" y2="680" />
    <line x1="60" y1="760" x2="840" y2="760" />
    <line x1="60" y1="840" x2="840" y2="840" />
    <line x1="60" y1="920" x2="840" y2="920" />
  </g>

  <!-- Title & Status -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#06b6d4" letter-spacing="2">TRUE STROKE FORENSICS • 1:1 MAP</text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">A-V-Z Single Continuous Path (Follow Arrows)</text>
  </g>

  <!-- THE MASTER UNISTROKE PATH -->
  <g filter="url(#trace-glow)">
    
    <!-- Segment 1: START -> Left Entry -->
    <!-- (500, 920) -> (330, 720) -->
    <path d="M 500 920 L 330 720" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <!-- Arrow on Segment 1 -->
    <polygon points="415,820 405,805 425,815" fill="#10b981" transform="rotate(-40 415 820)" />

    <!-- Segment 2: Left entry -> Up to Left Peak -->
    <!-- (330, 720) -> (240, 360) -->
    <path d="M 330 720 L 240 360" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" />
    <!-- Arrow on Segment 2 -->
    <polygon points="285,540 275,525 295,535" fill="#06b6d4" transform="rotate(-65 285 540)" />

    <!-- Segment 3: Left Peak -> Down to Bottom Loop (The V dive) -->
    <!-- (240, 360) -> (420, 780) -->
    <path d="M 240 360 L 420 780" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round" />
    <!-- Arrow on Segment 3 -->
    <polygon points="330,570 340,585 320,575" fill="#8b5cf6" transform="rotate(70 330 570)" />

    <!-- Segment 4: Bottom Loop -> Up to Right Peak -->
    <!-- (420, 780) -> (435, 785) -> (530, 480) -->
    <path d="M 420 780 Q 435 800 445 780 L 530 480" stroke="#c084fc" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Arrow on Segment 4 -->
    <polygon points="485,630 475,615 495,625" fill="#c084fc" transform="rotate(-75 485 630)" />

    <!-- Segment 5: Right Peak -> Horizontal Cut across to Left (A-Crossbar & Z-Top) -->
    <!-- (530, 480) -> (220, 560) -->
    <path d="M 530 480 L 220 560" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <!-- Arrow on Segment 5 -->
    <polygon points="375,520 360,525 370,510" fill="#38bdf8" transform="rotate(-195 375 520)" />

    <!-- Segment 6: Left Junction -> Up to Highest Apex (A-Crown) -->
    <!-- (220, 560) -> (350, 140) -->
    <path d="M 220 560 L 350 140" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />
    <!-- Arrow on Segment 6 -->
    <polygon points="285,350 295,335 275,345" fill="#f43f5e" transform="rotate(-65 285 350)" />

    <!-- Segment 7: Highest Apex -> Down towards End -->
    <!-- (350, 140) -> (520, 480) -->
    <path d="M 350 140 L 520 480" stroke="#fb923c" stroke-width="7" stroke-linecap="round" />
    <!-- Arrow on Segment 7 -->
    <polygon points="435,310 445,325 425,315" fill="#fb923c" transform="rotate(65 435 310)" />

    <!-- Segment 8: Exit straight to END -->
    <!-- (520, 480) -> (520, 120) -->
    <path d="M 520 480 L 520 120" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <!-- Arrow on Segment 8 -->
    <polygon points="520,280 510,265 530,265" fill="#10b981" />
  </g>

  <!-- WAYPOINT PINS & LABELS -->
  <!-- START -->
  <g transform="translate(500, 920)">
    <circle cx="0" cy="0" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <text x="20" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#10b981">START (Pen Touchdown)</text>
  </g>

  <!-- Step 1: Upward Arm -->
  <circle cx="240" cy="360" r="7" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  <text x="180" y="345" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#06b6d4">Step 2: Left Peak</text>

  <!-- Step 2: The V Spike -->
  <circle cx="425" cy="785" r="9" fill="#8b5cf6" stroke="#ffffff" stroke-width="3" />
  <text x="445" y="810" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="900" fill="#c084fc">V (Vision Spike)</text>

  <!-- Step 3: Right Peak -->
  <circle cx="530" cy="480" r="7" fill="#c084fc" stroke="#ffffff" stroke-width="2" />
  <text x="550" y="485" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#c084fc">Step 4: Right Turn</text>

  <!-- Step 4: Horizontal Bar -->
  <circle cx="220" cy="560" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  <text x="90" y="565" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#38bdf8">Step 5: Crossbar</text>

  <!-- Step 5: Highest Apex (A) -->
  <circle cx="350" cy="140" r="10" fill="#f43f5e" stroke="#ffffff" stroke-width="3" />
  <text x="350" y="105" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="900" fill="#f43f5e" text-anchor="middle">A (Accuracy Apex)</text>

  <!-- END -->
  <g transform="translate(520, 120)">
    <circle cx="0" cy="0" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <text x="20" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="900" fill="#10b981">END (Pen Lift-off)</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(60, 975)">
    <rect width="780" height="45" rx="12" fill="#0f172a" stroke="#334155" />
    <text x="20" y="28" font-family="system-ui" font-size="13" font-weight="700" fill="#94a3b8">
      Letter Breakdown: <tspan fill="#f43f5e">A (Apex Needle + Crossbar)</tspan> • <tspan fill="#c084fc">V (Bottom Downward Spike)</tspan> • <tspan fill="#38bdf8">Z (Crossbar + Diagonal + Baseline)</tspan>
    </text>
  </g>
</svg>